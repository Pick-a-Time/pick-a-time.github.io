<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pick a Time</title>
<meta name="description" content="Doodle-style group scheduling poll. Share one link, everyone marks the times that work in their own time zone, no sign-in needed.">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:title" content="Pick a Time">
<meta property="og:description" content="Find the time that works for everyone.">
<meta property="og:image" content="og.png">
<meta name="theme-color" content="#f6f3ee">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Warm paper palette shared with DayBrief; Frog Baby's red overalls and lily-pad green carry the accents.
   Layout: one centered working column, the response grid is the only part that may scroll sideways. */
:root{
  --paper:#f6f3ee; --card:#ffffff; --ink:#1f2430; --ink-2:#555b68; --ink-3:#8a8f99; --line:#e7e2d9;
  --sun:#f2994a; --sun-deep:#d9762b; --sun-soft:#fdeedf;
  --berry:#b83a45; --berry-soft:#fbe7e8;
  --yes:#3f9b6e; --yes-soft:#e3f3ea; --maybe:#d29a1c; --maybe-soft:#fcf1d4; --no:#9aa0aa; --no-soft:#f0ede8;
  --hero-a:#ffe3c4; --hero-b:#fff4e6; --hero-c:#fdf8f1;
  --f-display:"Fredoka",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Apple SD Gothic Neo","Malgun Gothic","Hiragino Sans","PingFang SC","Microsoft YaHei",sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Apple SD Gothic Neo","Malgun Gothic","Hiragino Sans","PingFang SC","Microsoft YaHei",sans-serif;
  --radius:14px; --shadow:0 1px 2px rgba(31,36,48,.05),0 6px 18px rgba(31,36,48,.05);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#1c1916; --card:#262220; --ink:#f1ece6; --ink-2:#c4bbb1; --ink-3:#958c83; --line:#3a3430;
    --sun:#f5a65e; --sun-deep:#f5a65e; --sun-soft:#3d2c1d; --berry:#e57a83; --berry-soft:#3d2326;
    --yes:#5cc08f; --yes-soft:#1f3a2c; --maybe:#e6b54a; --maybe-soft:#3c3018; --no:#8d867f; --no-soft:#302b27;
    --hero-a:#3d2b1c; --hero-b:#2e241c; --hero-c:#262220; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
a{color:var(--sun-deep)}
[hidden]{display:none!important}
.wrap{max-width:1060px;margin:0 auto;padding:0 20px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:22px;color:var(--ink);text-decoration:none}
.brand img{width:40px;height:40px;object-fit:contain}
.lang{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.lang select{width:auto;padding:6px 10px;background:var(--card)}
.bar{margin:0 0 14px;padding:10px 14px;border-radius:10px;font-size:14px}
.bar.demo{background:var(--maybe-soft)}
.bar.err{background:var(--berry-soft);color:var(--berry)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2;font-weight:600}
h1{font-size:34px;letter-spacing:-.01em}
h2{font-size:20px}
h3{font-size:16px}
.eyebrow{margin:0 0 6px;color:var(--sun-deep);font-weight:600;font-size:13px;letter-spacing:.02em}
.lede{color:var(--ink-2);max-width:62ch;margin:10px 0 0}
.note{font-size:13px;color:var(--ink-3);margin:2px 0 0}
.muted{color:var(--ink-3)}
.err{color:var(--berry);font-size:13px;margin:4px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.stack{display:grid;gap:16px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.btn{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;padding:9px 15px;border-radius:10px;cursor:pointer;text-decoration:none;transition:transform .1s,border-color .15s}
.btn:hover{border-color:var(--sun)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--sun);border-color:var(--sun);color:#fff}
.btn.primary:hover{background:var(--sun-deep);border-color:var(--sun-deep)}
.btn.big{padding:12px 20px;font-size:16px;border-radius:12px}
.btn.small{padding:5px 11px;font-size:13px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sun-soft)}
.btn.danger{color:var(--berry)}
.btn.danger.solid{background:var(--berry);border-color:var(--berry);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--sun-deep);outline-offset:2px}
label.f{display:grid;gap:6px;font-weight:600;font-size:14px}
input[type=text],input[type=time],input[type=datetime-local],select,textarea{font:inherit;font-weight:400;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea{min-height:72px;resize:vertical}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill:empty{display:none}
.pill.open{background:var(--yes-soft);color:var(--yes)}
.pill.expired{background:var(--maybe-soft);color:var(--maybe)}
.pill.closed{background:var(--sun-soft);color:var(--sun-deep)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
img.fb{display:block;height:auto;object-fit:contain}

/* hero */
.hero{display:grid;grid-template-columns:1.25fr .75fr;align-items:center;gap:20px;padding:28px 30px;border-radius:20px;border:1px solid var(--line);
  background:linear-gradient(100deg,var(--hero-a),var(--hero-b) 60%,var(--hero-c));box-shadow:var(--shadow)}
.hero h1{font-size:40px}
.hero-fb{width:100%;max-width:300px;margin:0 auto}
.code-form{margin-top:16px;gap:8px}
.code-form label{font-size:13px;color:var(--ink-2);font-weight:600}
.code-form input{width:170px;background:var(--card)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}
.step{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px 12px 10px;box-shadow:var(--shadow)}
.step-fb{width:76px;flex:none}
.step b{display:block;font-family:var(--f-display);font-weight:600;font-size:16px;color:var(--ink)}
.step span{font-size:13px;color:var(--ink-2)}
.list{display:grid;gap:8px}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--paper);text-decoration:none;color:var(--ink)}
.item:hover{border-color:var(--sun)}
.item .t{font-weight:600}
.item .m{font-size:13px;color:var(--ink-3)}
.empty{display:flex;align-items:center;gap:14px;color:var(--ink-2)}
.empty .empty-fb{width:110px;flex:none}
.empty.small .empty-fb{width:80px}
.empty.big{flex-direction:column;text-align:center;padding:40px 0}
.empty.big .empty-fb{width:170px}
.page-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.head-fb{width:74px}

/* calendar + slots */
.cal{max-width:340px}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-grid .dow{font-size:12px;color:var(--ink-3);padding:4px 0;font-weight:600}
.cal-grid .dow.sun{color:var(--berry)}
.cal-grid button{aspect-ratio:1;border:1px solid transparent;border-radius:10px;background:var(--paper);color:var(--ink);font:inherit;font-size:14px;cursor:pointer;font-variant-numeric:tabular-nums}
.cal-grid button:hover:not(:disabled){border-color:var(--sun)}
.cal-grid button.on{background:var(--sun);color:#fff;font-weight:700}
.cal-grid button.today{border-color:var(--sun-deep)}
.cal-grid button:disabled{opacity:.35;cursor:default}
.slot-layout{display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:2px;background:var(--sun-soft);color:var(--sun-deep);border-radius:999px;padding:3px 4px 3px 11px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.chip button{border:0;background:none;color:inherit;cursor:pointer;font-size:15px;line-height:1;padding:0 5px}
.addtime{display:inline-flex;gap:4px;align-items:center}
.addtime input{width:auto;padding:4px 6px;font-size:13px}
.daterow{display:grid;grid-template-columns:120px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.daterow:first-child{border-top:0}
.daterow .d{font-weight:600;font-size:14px}

/* poll */
.poll-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.poll-fb{width:120px;flex:none}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--ink-2);margin-top:10px}
.meta .loc{color:var(--ink);font-weight:600}
.share{display:grid;gap:10px;background:var(--sun-soft);border-color:#f5d2ac}
.share .line{display:flex;gap:8px}
.share input{font-size:13px;background:var(--card)}
.admin-link{display:grid;gap:8px}
.admin-link summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--sun-deep)}
.admin-link[open]{display:grid;gap:8px}
.final{display:flex;gap:18px;align-items:center;border-color:var(--yes);background:var(--yes-soft)}
.final-fb{width:110px;flex:none}
.final .eyebrow{color:var(--yes)}
.final .when{font-family:var(--f-display);font-size:24px;font-weight:600}
.banner{display:flex;align-items:center;gap:12px;padding:8px 14px;border-radius:12px;background:var(--maybe-soft);font-size:14px}
.banner-fb{width:52px}
.tzpick{min-width:230px;max-width:320px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--ink-2);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .cell{width:24px;height:20px}
.legend .hint{color:var(--ink-3)}
.grid-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table.grid{border-collapse:separate;border-spacing:0;min-width:100%;font-variant-numeric:tabular-nums}
.grid th,.grid td{border-bottom:1px solid var(--line);padding:6px;text-align:center;font-size:13px;white-space:nowrap}
.grid th.who{position:sticky;left:0;background:var(--card);text-align:left;min-width:170px;max-width:230px;padding:8px 12px;font-weight:600;z-index:1;border-right:1px solid var(--line);white-space:normal}
.grid th.who .x{border:0;background:none;color:var(--ink-3);cursor:pointer;font-size:15px;margin-left:6px;padding:0 4px;border-radius:6px}
.grid th.who .x:hover{color:var(--berry);background:var(--berry-soft)}
.grid th.who input{padding:6px 9px;font-size:13px;background:var(--card)}
.grid .dhead{border-left:1px solid var(--line);font-weight:600}
.grid .thead{color:var(--ink-2);font-weight:500;border-left:1px solid var(--line);min-width:66px}
.grid .thead.best{color:var(--yes);font-weight:700}
.grid td{border-left:1px solid var(--line)}
.grid tr.mine th.who{background:var(--sun-soft)}
.grid tr.mine td{background:color-mix(in srgb,var(--sun-soft) 55%,transparent)}
.grid tr.tally th,.grid tr.tally td{border-bottom:0;font-weight:700}
.grid tr.tally td.best{background:var(--yes-soft);color:var(--yes)}
.grid tr.tally small{font-weight:600;color:var(--maybe);margin-left:3px}
.cell{width:42px;height:32px;border-radius:8px;border:1px solid var(--line);display:inline-grid;place-items:center;background:var(--paper);color:var(--ink-3)}
button.cell{cursor:pointer;font:inherit}
button.cell:hover{border-color:var(--sun)}
.cell.v-y{background:var(--yes-soft);border-color:var(--yes);color:var(--yes)}
.cell.v-m{background:var(--maybe-soft);border-color:var(--maybe);color:var(--maybe)}
.cell.v-n{background:var(--no-soft);border-color:var(--no-soft);color:var(--no)}
.rank{display:grid;gap:8px}
.rank .r{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:12px}
.rank .r.top{border-color:var(--yes);background:var(--yes-soft)}
.rank .n{font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--ink-3)}
.rank .r.top .n{color:var(--yes)}
.who-yes{font-size:12px;color:var(--ink-3)}
.rank .meter{height:6px;border-radius:3px;background:var(--no-soft);overflow:hidden;display:flex;margin-top:5px;max-width:280px}
.rank .meter i{display:block;height:100%}
.rank .meter .y{background:var(--yes)}.rank .meter .m{background:var(--maybe)}
.tools{border-style:dashed}

/* footer + toast */
footer.foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin:34px 0 26px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-3)}
footer .foot-l{display:flex;align-items:center;gap:10px}
footer .foot-l img{width:46px}
.coffee{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--line);padding:6px 12px 6px 6px;border-radius:999px}
.coffee img{width:30px}
.coffee:hover{border-color:var(--sun)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--paper);padding:8px 16px 8px 8px;border-radius:14px;font-size:14px;z-index:10;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.toast .toast-fb{width:40px}

@media (max-width:760px){
  .hero{grid-template-columns:1fr;padding:22px}
  .hero h1{font-size:30px}
  .hero-art{order:-1}
  .hero-fb{max-width:180px}
  .steps{grid-template-columns:1fr}
  .slot-layout{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  .poll-fb{width:84px}
  h1{font-size:28px}
}
@media (max-width:520px){
  .daterow{grid-template-columns:1fr auto}
  .daterow .chips{grid-column:1/-1}
  .final{flex-direction:column;align-items:flex-start}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="#/"><img src="img/wave.webp" alt="" width="40" height="40"><span>Pick a Time</span></a>
    <label class="lang" for="langSel">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M1.5 8h13M8 1.5c2 2 2.8 4 2.8 6.5S10 12.5 8 14.5M8 1.5C6 3.5 5.2 5.5 5.2 8S6 12.5 8 14.5" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
      <select id="langSel" aria-label="Language"></select>
    </label>
  </header>
  <div id="demoBar" class="bar demo" hidden></div>
  <div id="dbBar" class="bar err" role="alert" hidden></div>
  <main id="app"></main>
  <footer class="foot">
    <div class="foot-l"><img src="img/music.webp" alt="" width="46" height="38"><span id="footTxt"></span></div>
    <a class="coffee" id="coffee" href="https://buymeacoffee.com/henryyu" target="_blank" rel="noopener"><img src="img/gift.webp" alt="" width="30" height="30"><span>Buy me a coffee</span></a>
  </footer>
</div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
